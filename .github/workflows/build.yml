name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: powershell
        run: ./build.ps1 -Test -Package
      - uses: actions/upload-artifact@v4
        with:
          name: LumaStereo-win-x64
          path: dist/LumaStereo-1.1.2-win-x64.zip
